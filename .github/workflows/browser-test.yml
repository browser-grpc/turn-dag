# Runs the Playwright WebRTC suite in its Docker gate form: host
# networking (real LAN path to the relay) + TUN/NET_ADMIN (turns:
# tests). REQUIRE_RELAY=1 makes gather/relay/mesh/TLS failures hard
# failures with a minimum PASS count. The old loopback npm job is
# gone - it skipped almost everything by design.
name: browser-test
on: [push, pull_request]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target browser -t turn-dag:browser .
      - run: >-
          docker run --rm --network host --cap-add NET_ADMIN
          --device /dev/net/tun turn-dag:browser
