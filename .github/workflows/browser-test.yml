# Runs the Playwright WebRTC suite against the live Rust TURN server.
# GitHub-hosted runners use loopback TURN (policy-blocked in headless
# browsers), so network sub-tests SKIP there; the hard gate is the
# Docker --network host job (scripts/browser-test.sh, REQUIRE_RELAY=1,
# MIN_PASS>=10). Raw-wire and negative sub-tests still FAIL here.
name: browser-test
on: [push, pull_request]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p turn-dag-node
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install firefox chromium webkit --with-deps
        working-directory: tests/browser
      - run: node run.mjs
        working-directory: tests/browser
        env:
          TURN_HOST: 127.0.0.1
          BROWSERS: firefox,chromium,webkit
