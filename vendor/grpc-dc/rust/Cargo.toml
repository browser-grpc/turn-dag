[package]
name = "grpc-dc"
version = "0.1.0"
edition = "2021"
description = "gRPC over WebRTC DataChannels — Rust runtime (vendored from browser-grpc/grpc-over-datachannels @ fdd4374e, examples/dev-deps stripped for turn-dag embedding)"
license = "Apache-2.0"

[lib]
name = "grpc_dc"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = []
prost = ["dep:prost"]
webrtc = ["dep:dc-webrtc"]
kafka-tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-pemfile"]
http2-tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-pemfile"]

[dependencies]
async-trait = "0.1"
bytes = "1"
futures-channel = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
dc-webrtc = { path = "../webrtc/rust", optional = true }
prost = { version = "0.14", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "net"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = { version = "2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "rt"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
