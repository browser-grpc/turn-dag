<h1>gRPC (grpc-dc rendezvous) over TURN/TCP</h1>
<p>The embedded grpc-dc Echo server is dialed with
<code>rendezvousChannel</code> restricted to a TURN relay
(<code>iceTransportPolicy: "relay"</code> over
<code>turn:...?transport=tcp</code>): every packet between this
browser and the gRPC server traverses the TURN/TCP relay.</p>
