[package]
name = "turn-dag-node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
turn-dag-element = { path = "../turn-dag-element" }
turn-dag-wallet = { path = "../turn-dag-wallet" }
turn-dag-ledger = { path = "../turn-dag-ledger" }
turn-dag-minter = { path = "../turn-dag-minter" }
turn-dag-turn = { path = "../turn-dag-turn" }
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-udp", "socket-tcp"] }
getrandom = "0.4.3"
# Embedded gRPC rendezvous server (vendored browser-grpc/grpc-over-datachannels).
grpc-dc = { path = "../../vendor/grpc-dc/rust", features = ["webrtc"] }
dc-webrtc = { path = "../../vendor/grpc-dc/webrtc/rust" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
serde_bytes = "0.11"
sha2.workspace = true

[dev-dependencies]
turn-dag-element = { path = "../turn-dag-element" }
turn-dag-wallet = { path = "../turn-dag-wallet" }
turn-dag-ledger = { path = "../turn-dag-ledger" }
turn-dag-minter = { path = "../turn-dag-minter" }
turn-dag-turn = { path = "../turn-dag-turn" }
